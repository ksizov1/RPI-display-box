name: Adiona-TV release

# Two independent things live here, on deliberately different triggers:
#
#   push to main       -> package preflight + the OTA tarball, and the version TAG
#                         that names it. Fully automatic, a couple of minutes.
#   workflow_dispatch  -> the flashable SD-card image. 45-75 minutes, needed only
#                         for new hardware, so it is started by hand from the
#                         Actions tab.
#
# THE TAG IS DERIVED FROM THE VERSION FILE, never typed. A push whose VERSION is
# new gets tagged and released; a push whose VERSION is unchanged is a no-op. That
# makes "tag disagrees with VERSION" impossible rather than merely guarded against
# - it cost two failed builds and a re-tag before it worked this way.
#
# Pushes made with GITHUB_TOKEN do not trigger workflows, so the tag this creates
# cannot start another run.
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('Image build (manual, {0})', github.ref_name)
      || format('Release check ({0})', github.ref_name) }}

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  # pi-gen only reaches our stage ~40 minutes into the build, so a bad package
  # name costs most of a build to discover. This resolves the name list in about
  # a minute, IN PARALLEL with the build.
  #
  # Deliberately NOT a gate (no `needs` on it, continue-on-error). It blocked two
  # correct releases while the fault was in the check itself, which is a far worse
  # outcome than the rare mistake it guards against: you still see the answer a
  # minute in and can cancel the build yourself, but a broken checker can no
  # longer stop a good image from being produced.
  preflight-packages:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runs the apt query in a throwaway container rather than making the whole
      # job run *inside* one: actions/checkout in a bare debian container has no
      # git and behaves differently, and debugging that is not worth it for a
      # 60-second check. Here checkout is ordinary and only apt is containerised.
      - name: Resolve stage-adiona package names
        run: |
          PKGFILE=image/pi-gen/stage-adiona/00-install/00-packages
          if [ ! -f "$PKGFILE" ]; then
            echo "::warning::$PKGFILE not found - skipping package preflight"
            exit 0
          fi
          echo "Checking $(grep -cve '^[[:space:]]*$' "$PKGFILE") package name(s)."

          # Pull SEPARATELY and quietly. `docker run` writes image-pull progress to
          # STDERR, so folding stderr into the captured output (an earlier version
          # did) turned every progress line into a "missing package" and failed the
          # check 100% of the time, whatever the package list actually said.
          if ! docker pull -q debian:trixie >/dev/null 2>&1; then
            echo "::warning::could not pull debian:trixie - skipping package preflight"
            exit 0
          fi

          # Name existence only, against plain Debian trixie - not dependency
          # resolution. The Raspberry Pi archive publishes no amd64 index so it
          # cannot be added here; every package the image installs also exists in
          # Debian, which is what makes this check meaningful.
          #
          # Findings are emitted with an explicit MISSING: prefix and nothing else
          # is parsed, so stray container output can never be mistaken for a result.
          # stdout only - stderr is left on the console for humans.
          set +e
          out="$(docker run --rm -v "$PWD:/w" -w /w debian:trixie bash -c '
            apt-get update -qq >/dev/null 2>&1 || { echo "APTFAIL:"; exit 0; }
            while read -r pkg; do
              [ -n "$pkg" ] || continue
              case "$pkg" in \#*) continue ;; esac
              apt-cache show "$pkg" >/dev/null 2>&1 || echo "MISSING:$pkg"
            done < '"$PKGFILE"'
            echo "DONE:"
          ')"
          rc=$?
          set -e

          # A broken checker must never block a release. Only a POSITIVE finding -
          # named packages that did not resolve - is treated as a failure; anything
          # else is a warning.
          if [ $rc -ne 0 ]; then
            echo "::warning::package preflight could not run (docker exit $rc)"
            exit 0
          fi
          if printf '%s\n' "$out" | grep -q '^APTFAIL:'; then
            echo "::warning::apt-get update failed inside the check container"
            exit 0
          fi
          if ! printf '%s\n' "$out" | grep -q '^DONE:'; then
            echo "::warning::package preflight did not run to completion"
            exit 0
          fi

          missing="$(printf '%s\n' "$out" | sed -n 's/^MISSING://p')"
          if [ -n "$missing" ]; then
            echo "::error::Unknown package name(s): $(printf '%s' "$missing" | tr '\n' ' ')"
            echo ""
            echo "These do not exist in Debian trixie. Either the name is wrong, or the"
            echo "package is Raspberry-Pi-archive-only (this check cannot see that archive"
            echo "- it has no amd64 index). Verify which package ships a given file at:"
            echo "  https://packages.debian.org/search?searchon=contents&keywords=<file>&suite=trixie&arch=arm64"
            echo "If it really is Pi-only, drop it from this check explicitly."
            exit 1
          fi
          echo "All package names resolve."

  # The OTA payload boxes in the field download, as opposed to the image a fresh
  # card is flashed with. Minutes, not an hour — an image build is for new
  # hardware, this is for the fleet that already exists.
  # The OTA payload boxes in the field download, as opposed to the image a fresh
  # card is flashed with. Minutes, not an hour - an image build is for new
  # hardware, this is for the fleet that already exists.
  release-tarball:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history AND tags: the gate below has to know whether this
          # version has already been released, and from which commit.
          fetch-depth: 0

      # The whole release decision, in one place: is VERSION a version we have not
      # published yet? Everything after this is conditional on the answer.
      #
      # A push that does not bump VERSION is a no-op, not a failure. Ordinary work
      # lands on main constantly; turning each of those into a red X would train
      # everyone to ignore red.
      - name: Decide whether this push is a release
        id: gate
        run: |
          ver="$(head -1 VERSION | tr -d '[:space:]')"
          case "$ver" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::VERSION is '$ver', which is not x.y.z"; exit 1 ;;
          esac
          tag="v$ver"
          head="$(git rev-parse HEAD)"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"     >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            at="$(git rev-parse "$tag^{commit}")"
            if [ "$at" = "$head" ]; then
              echo "$tag already exists and points here - nothing to do (re-run?)."
            else
              echo "$tag already exists at ${at:0:7}, and this is ${head:0:7}."
              echo "Bump VERSION to publish a new release."
            fi
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "### No release: VERSION is still \`$ver\`" >> "$GITHUB_STEP_SUMMARY"
            echo "Bump \`VERSION\` and push to publish one." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "$tag is new - releasing ${head:0:7}."

      - name: Build OTA tarball
        if: steps.gate.outputs.publish == 'true'
        run: |
          # Fixed timestamps from the commit, so the archive - and therefore its
          # sha256 - is reproducible from the tag alone.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" bash tools/make-release.sh
          cat dist/box_versions.json

      # Created here rather than typed by a human: the tag and VERSION are then the
      # same fact expressed twice, and cannot drift. Lightweight, so it needs no
      # committer identity. Pushed BEFORE the release is cut so the release has
      # something to attach to.
      - name: Tag ${{ steps.gate.outputs.tag }}
        if: steps.gate.outputs.publish == 'true'
        run: |
          git tag "${{ steps.gate.outputs.tag }}"
          git push origin "${{ steps.gate.outputs.tag }}"

      # There is deliberately NO fragment-signing step here, and no
      # ADIONA_UPDATE_SIGNING_KEY secret on this repository.
      #
      # The signature a box verifies is produced by the licence server at request
      # time from Key Vault - it has to be, because the manifest varies per box
      # with `pins` and `rollout` and so cannot be signed in advance. A signature
      # over this fragment would be checked by nothing, while requiring the key
      # that authorises running code as root across the whole fleet to sit in CI,
      # where any workflow with write access could exfiltrate it.
      #
      # The fragment already arrives over an authenticated channel (a GitHub
      # release), and what protects data/box_versions.json from a bad edit is
      # review of that commit - not a detached signature nobody verifies.
      - name: Publish the release
        if: steps.gate.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.gate.outputs.tag }}
          name: ${{ steps.gate.outputs.tag }}
          files: |
            dist/adiona-tv-*.tar.gz
            dist/box_versions.json
          body: |
            **OTA update** for boxes already in the field.

            1. Upload `adiona-tv-${{ steps.gate.outputs.version }}.tar.gz` to
               `/var/www/license-api-binaries/5/` on the licence server.
            2. Write a real `notes` line in `box_versions.json`, then use it to
               REPLACE `data/box_versions.json` there. It is the complete manifest,
               not a fragment - nothing to splice.
            3. Run `bash tools/verify-signing.sh`, which checks the signature and
               the shape and tells you what a box would actually be offered.
            See `Adiona-license-server/docs/BOX_UPDATES.md`.

            The flashable SD-card image is NOT built automatically. Start
            "Adiona-TV release" from the Actions tab with workflow_dispatch when a
            new card is needed; it attaches the `.img.xz` to this release.

  build:
    runs-on: ubuntu-latest
    # MANUAL ONLY. 45-75 minutes, and needed only when a card is being flashed -
    # which is rare, and never a consequence of an ordinary push. Start it from the
    # Actions tab: Run workflow -> pick the branch.
    if: github.event_name == 'workflow_dispatch'
    # Needed to attach the .img.xz to the release. Without it the upload fails at
    # the very end of a 45-minute build, which is the worst possible moment.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # No tag/VERSION guard here any more: the tag IS derived from VERSION by the
      # release job, so they cannot disagree. What this needs to know instead is
      # whether a release already exists for the version being built, because that
      # is where the image belongs.
      - name: Which release does this image belong to?
        id: target
        run: |
          ver="$(head -1 VERSION | tr -d '[:space:]')"
          tag="v$ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "attach=true" >> "$GITHUB_OUTPUT"
            echo "will attach the image to release $tag"
          else
            echo "attach=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no release $tag yet - the image will be a run artifact."
            echo "Push a VERSION bump to main first if you want it on the release."
          fi

      # pi-gen cross-builds arm64 on this x86 runner. build-docker.sh does a
      # host-side `which qemu-aarch64` check and registers the binfmt handler
      # itself (with the fix_binary/F flag), so the host just needs the actual
      # qemu-aarch64 binary on PATH — provided by qemu-user / qemu-user-binfmt.
      - name: Install static qemu for arm64 cross-build
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          # build-docker.sh registers `which qemu-aarch64` as the binfmt
          # interpreter (with the F flag). It MUST be the STATIC qemu — the
          # dynamic build can't run inside pi-gen's container (its shared libs
          # aren't present there). Expose the static binary under that name.
          sudo ln -sf /usr/bin/qemu-aarch64-static /usr/local/bin/qemu-aarch64
          qemu-aarch64 --version | head -n1

      - name: Assemble stage payload
        run: bash image/assemble-stage.sh

      - name: Clone pi-gen (arm64 / 64-bit branch)
        run: git clone --depth 1 --branch arm64 https://github.com/RPi-Distro/pi-gen.git pi-gen

      - name: Install custom stage + config
        run: |
          cp -r image/pi-gen/stage-adiona pi-gen/stage-adiona
          cp image/pi-gen/config pi-gen/config
          # Only our stage should export an image (stage2 still builds the rootfs).
          touch pi-gen/stage2/SKIP_IMAGES
          chmod +x pi-gen/stage-adiona/prerun.sh pi-gen/stage-adiona/00-install/01-run.sh

      - name: Build image with pi-gen (Docker)
        working-directory: pi-gen
        run: ./build-docker.sh

      # Two destinations, deliberately:
      #
      #   * a RELEASE asset on a tag, so the flashable image and the OTA tarball
      #     for the same version sit on one page. Hunting an .img.xz down inside a
      #     45-minute workflow run - a different tab, a different retention policy,
      #     and a zip wrapper around it - is not where a release artifact belongs.
      #   * a workflow ARTIFACT otherwise, because a manual workflow_dispatch build
      #     has no tag and therefore no release to attach to.
      - name: Attach the image to release ${{ steps.target.outputs.tag }}
        if: steps.target.outputs.attach == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.target.outputs.tag }}
          files: pi-gen/deploy/*
          fail_on_unmatched_files: true

      - name: Upload image artifact (no release to attach to)
        if: steps.target.outputs.attach != 'true' 
        uses: actions/upload-artifact@v4
        with:
          name: adiona-tv-image
          path: pi-gen/deploy/*
          if-no-files-found: error
