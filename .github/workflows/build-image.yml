name: Build Adiona-TV image

# Builds the flashable 64-bit Raspberry Pi OS image in the cloud and uploads it
# as a build artifact — no local Linux/Docker needed. Run it from the Actions
# tab (workflow_dispatch) or on a version tag.
#
# Drives pi-gen directly (same as image/build-image.sh) rather than via a wrapper
# action, so the full pi-gen build log streams into the Actions output.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  # pi-gen only reaches our stage ~40 minutes into the build, so a bad package
  # name costs most of a build to discover. This resolves the name list in about
  # a minute, IN PARALLEL with the build.
  #
  # Deliberately NOT a gate (no `needs` on it, continue-on-error). It blocked two
  # correct releases while the fault was in the check itself, which is a far worse
  # outcome than the rare mistake it guards against: you still see the answer a
  # minute in and can cancel the build yourself, but a broken checker can no
  # longer stop a good image from being produced.
  preflight-packages:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Runs the apt query in a throwaway container rather than making the whole
      # job run *inside* one: actions/checkout in a bare debian container has no
      # git and behaves differently, and debugging that is not worth it for a
      # 60-second check. Here checkout is ordinary and only apt is containerised.
      - name: Resolve stage-adiona package names
        run: |
          PKGFILE=image/pi-gen/stage-adiona/00-install/00-packages
          if [ ! -f "$PKGFILE" ]; then
            echo "::warning::$PKGFILE not found - skipping package preflight"
            exit 0
          fi
          echo "Checking $(grep -cve '^[[:space:]]*$' "$PKGFILE") package name(s)."

          # Name existence only, against plain Debian trixie - not dependency
          # resolution. The Raspberry Pi archive publishes no amd64 index so it
          # cannot be added here; every package the image installs also exists in
          # Debian, which is what makes this check meaningful.
          set +e
          out="$(docker run --rm -v "$PWD:/w" -w /w debian:trixie bash -c '
            apt-get update -qq >/dev/null 2>&1 || { echo "__APTFAIL__"; exit 0; }
            while read -r pkg; do
              [ -n "$pkg" ] || continue
              case "$pkg" in \#*) continue ;; esac
              apt-cache show "$pkg" >/dev/null 2>&1 || echo "$pkg"
            done < '"$PKGFILE"'
          ' 2>&1)"
          rc=$?
          set -e

          # A broken checker must never block a release. Only a POSITIVE finding -
          # named packages that do not resolve - fails this job; anything else is
          # reported as a warning and the build proceeds.
          if [ $rc -ne 0 ]; then
            echo "::warning::package preflight could not run (docker exit $rc). Build continues."
            echo "$out"
            exit 0
          fi
          if printf '%s' "$out" | grep -q '__APTFAIL__'; then
            echo "::warning::apt-get update failed in the check container. Build continues."
            exit 0
          fi

          missing="$(printf '%s' "$out" | sed '/^[[:space:]]*$/d')"
          if [ -n "$missing" ]; then
            echo "::error::Unknown package name(s): $(printf '%s' "$missing" | tr '\n' ' ')"
            echo ""
            echo "These do not exist in Debian trixie. Either the name is wrong, or the"
            echo "package is Raspberry-Pi-archive-only (this check cannot see that archive"
            echo "- it has no amd64 index). Verify which package ships a given file at:"
            echo "  https://packages.debian.org/search?searchon=contents&keywords=<file>&suite=trixie&arch=arm64"
            echo "If it really is Pi-only, drop it from this check explicitly."
            exit 1
          fi
          echo "All package names resolve."

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pi-gen cross-builds arm64 on this x86 runner. build-docker.sh does a
      # host-side `which qemu-aarch64` check and registers the binfmt handler
      # itself (with the fix_binary/F flag), so the host just needs the actual
      # qemu-aarch64 binary on PATH — provided by qemu-user / qemu-user-binfmt.
      - name: Install static qemu for arm64 cross-build
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          # build-docker.sh registers `which qemu-aarch64` as the binfmt
          # interpreter (with the F flag). It MUST be the STATIC qemu — the
          # dynamic build can't run inside pi-gen's container (its shared libs
          # aren't present there). Expose the static binary under that name.
          sudo ln -sf /usr/bin/qemu-aarch64-static /usr/local/bin/qemu-aarch64
          qemu-aarch64 --version | head -n1

      - name: Assemble stage payload
        run: bash image/assemble-stage.sh

      - name: Clone pi-gen (arm64 / 64-bit branch)
        run: git clone --depth 1 --branch arm64 https://github.com/RPi-Distro/pi-gen.git pi-gen

      - name: Install custom stage + config
        run: |
          cp -r image/pi-gen/stage-adiona pi-gen/stage-adiona
          cp image/pi-gen/config pi-gen/config
          # Only our stage should export an image (stage2 still builds the rootfs).
          touch pi-gen/stage2/SKIP_IMAGES
          chmod +x pi-gen/stage-adiona/prerun.sh pi-gen/stage-adiona/00-install/01-run.sh

      - name: Build image with pi-gen (Docker)
        working-directory: pi-gen
        run: ./build-docker.sh

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: adiona-tv-image
          path: pi-gen/deploy/*
          if-no-files-found: error
