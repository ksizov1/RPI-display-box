# Adiona-TV Wi-Fi behaviour, applied to every NetworkManager Wi-Fi connection.
# Installed to /etc/NetworkManager/conf.d/10-adiona-wifi.conf.
#
# These settings target the USB Wi-Fi dongle used for the internet uplink, which
# is the least reliable radio on the box: it is a client, it is often at range,
# and it shares the airtime with the AP the built-in radio is running.

[connection]
# Disable Wi-Fi power save (2 = disable). Power save is the single most common
# cause of a USB dongle that "works, then drops": the adapter sleeps between
# beacons, misses frames, and either stalls or gets deauthenticated by the AP.
# Many cheap dongles implement it badly. The box is mains-powered, so there is
# nothing to gain from it on either radio.
wifi.powersave = 2

[device]
# Do not randomise the MAC for scans. Randomisation makes some APs treat each
# scan as a new station, and confuses DHCP reservations and captive portals -
# both of which show up as an uplink that connects and then drops.
wifi.scan-rand-mac-address = no
