# Adiona-TV Wi-Fi behaviour, applied to every NetworkManager Wi-Fi connection.
# Installed to /etc/NetworkManager/conf.d/10-adiona-wifi.conf.
#
# NOTE ON POWER MANAGEMENT: this file used to force wifi.powersave=2 (disable),
# on the theory that power save was behind an unstable USB uplink. It was not -
# the cause was both radios sharing 2.4 GHz, with the AP's antenna centimetres
# from the dongle's. Disabling power save was measured to be already in effect
# while the link still failed, so it fixed nothing and only cost idle power and
# heat. Radio power management is left at the driver default, deliberately. Do
# not reintroduce it without evidence that it is the actual fault.

[device]
# Do not randomise the MAC for scans. Not a power setting: randomisation makes
# some APs treat each scan as a new station, and confuses DHCP reservations and
# captive portals - both of which look like an uplink that connects then drops.
wifi.scan-rand-mac-address = no
