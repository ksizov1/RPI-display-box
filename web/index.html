<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Adiona-TV</title>
<style>
  html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; cursor: none;
               font-family: system-ui, "DejaVu Sans", sans-serif; }
  input, button, select, textarea { font-family: inherit; }

  /* This page is the NON-LIVE screen only. Video is played natively by
     adiona-player.sh (GStreamer), which maps a Wayland surface on top of this
     one while a headset is casting — so there is no <video> here, and nothing to
     hide: when the stream is up, the player simply covers this page. */
  #overlay {
    position: fixed; inset: 0;
    background: #fff url("splash.png") top center / contain no-repeat;
  }

  /* Bottom ~20% status band — dark text on a translucent white panel so it stays
     legible over the white splash. */
  #statusbar {
    position: fixed; left: 0; right: 0; bottom: 0; height: 20%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 0.6vmin;
    background: rgba(255, 255, 255, 0.88);
    border-top: 1px solid rgba(0, 0, 0, 0.08);
    font-family: system-ui, "DejaVu Sans", sans-serif; color: #1a1a1a;
  }
  #title { font-size: 3.2vmin; font-weight: 700; color: #111; }
  #sub   { font-size: 2.1vmin; color: #555; }
  #join  { font-size: 2.4vmin; color: #222; }
  #join b { color: #c1121f; font-weight: 700; }   /* red, matching the D² logo */
  #uplink { font-size: 1.8vmin; color: #666; }
  #version { position: absolute; right: 2.2vmin; bottom: 1.2vmin;
             font-size: 1.7vmin; color: #9aa0a6; }
  .dot { display: inline-block; width: 1.4vmin; height: 1.4vmin; border-radius: 50%;
         margin-right: 0.8vmin; vertical-align: baseline; }
  .dot.ok { background: #1a7f37; } .dot.no { background: #c1121f; } .dot.unk { background: #8a8a8a; }
  .hint { color: #8a8a8a; font-size: 0.9em; }

  /* ── Screensaver ───────────────────────────────────────────────────────────
     The waiting screen is static for hours at a time and burned into a panel
     during development. This drifts the three brand elements around instead.

     The elements are CROPS OF splash.png via background-position, not separate
     image files: one asset stays the single source of truth, and there is
     nothing to regenerate if the splash is ever re-exported. The crop boxes were
     measured off the actual pixels (logos x764-1664 and x2104-3024, wordmark
     x360-3444 of 3840x2160), not eyeballed, so nothing clips.

     Half brightness comes from a pre-dimmed backdrop plus mix-blend-mode:
     multiply, NOT from a filter. Multiply against #808080 does both jobs at
     once: the white background each crop carries multiplies into the grey and
     disappears (255 x 128 / 255 = 128, an exact match, so no tile rectangles and
     no seams), while the artwork multiplies to half its value - the same result
     brightness(0.5) gave.

     It replaced `filter: brightness(0.5)` on this layer because that filtered
     the ENTIRE viewport every frame; multiply touches only the three element
     rectangles. On a Pi driving a TV this runs unattended for hours, so the
     difference is heat, not just frame time. */
  #saver { position: fixed; inset: 0; background: #808080; z-index: 5; display: none;
           cursor: none; }
  #saver.on { display: block; }
  .sv { position: absolute; top: 0; left: 0; background-image: url("splash.png");
        background-repeat: no-repeat; will-change: transform;
        mix-blend-mode: multiply; cursor: none; }
  /* size + crop window per element; heights preserve each source aspect ratio.
     Sized to match the wait screen, where the splash is displayed `contain` on a
     16:9 panel so the A logo spans ~23.4vw. */
  #sv-a   { width: 24vw;   height: 23.80vw;
            background-size: 419.22% 237.89%; background-position: 25.856% 8.945%; }
  #sv-d2  { width: 24vw;   height: 23.28vw;
            background-size: 410.26% 237.89%; background-position: 72.178% 8.945%; }
  #sv-txt { width: 68vw;   height: 6.66vw;
            background-size: 123.87% 710.53%; background-position: 47.569% 67.457%; }

  /* The settings panel: one card behind F12, two tabs (no mouse — arrows for the
     tabs and the lists, Tab between the fields, Enter/Esc). Both screens used to
     have a hotkey of their own; they were merged because every other key now
     belongs to the headset, and one thing to remember from across a room beats
     two. */
  #settings { position: fixed; inset: 0; z-index: 10; display: flex;
              align-items: center; justify-content: center;
              background: rgba(255, 255, 255, 0.98);
              font-family: system-ui, "DejaVu Sans", sans-serif; color: #1a1a1a; }
  #settings.settings-hidden { display: none; }
  .set-tabs { display: flex; align-items: center; gap: 1vmin; margin-bottom: 2vmin;
              padding-bottom: 1vmin; border-bottom: 2px solid #e0e0e0; }
  .set-tab { font-size: 2.4vmin; font-weight: 600; padding: 0.9vmin 2.4vmin;
             border: 2px solid transparent; border-radius: 1vmin;
             background: none; color: #777; }
  .set-tab.on { background: #e8f0fe; color: #1a73e8; }
  .set-tab:focus { outline: none; border-color: #1a73e8; }
  .set-hint { margin-left: auto; font-size: 1.7vmin; color: #888; white-space: nowrap; }
  .set-pane.pane-hidden { display: none; }
  .wifi-card { width: min(860px, 92vw); max-height: 94vh; display: flex; flex-direction: column; }
  .wifi-title { font-size: 3.4vmin; font-weight: 700; text-align: center; }
  .wifi-note { font-size: 1.9vmin; color: #555; text-align: center; margin: 1vmin 0 2vmin; line-height: 1.4; }
  .wifi-note b { color: #111; }
  .wifi-list { border: 2px solid #ccc; border-radius: 1vmin; overflow-y: auto;
               max-height: 40vh; background: #fff; }
  .wifi-list:focus { outline: none; border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26,115,232,.3); }
  .wifi-item { display: flex; align-items: center; gap: 1.5vmin; padding: 1.1vmin 1.6vmin;
               font-size: 2.2vmin; border-bottom: 1px solid #eee; }
  .wifi-item:last-child { border-bottom: none; }
  .wifi-item.sel { background: #e8f0fe; }
  .wifi-item .sig { width: 5ch; color: #777; font-size: 1.8vmin; text-align: right; }
  .wifi-item .name { flex: 1; font-weight: 600; }
  .wifi-item.off .name { color: #999; font-weight: 500; }
  .wifi-item .badge { font-size: 1.6vmin; padding: 0.3vmin 1vmin; border-radius: 0.8vmin; white-space: nowrap; }
  .badge.conn { background: #1a7f37; color: #fff; }
  .badge.saved { background: #e8eaed; color: #444; }
  .wifi-empty { padding: 2vmin; text-align: center; color: #888; font-size: 2vmin; }
  .wifi-fields { display: flex; gap: 2vmin; margin: 2vmin 0 1vmin; }
  .wifi-fields label { flex: 1; display: flex; flex-direction: column; gap: 0.5vmin;
                       font-size: 1.9vmin; color: #555; }
  .wifi-fields input { font-size: 2.4vmin; padding: 1vmin 1.2vmin; border: 2px solid #c2c2c2;
                       border-radius: 1vmin; background: #fff; color: #111; }
  .wifi-fields input:focus, .wifi-btns button:focus {
      outline: none; border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26,115,232,.35); }
  .wifi-btns { display: flex; gap: 1.5vmin; justify-content: center; margin: 1vmin 0; flex-wrap: wrap; }
  .wifi-btns button { font-size: 2.2vmin; padding: 1vmin 2.6vmin; border: 2px solid #c2c2c2;
                      border-radius: 1vmin; background: #f3f3f3; color: #111; }
  .wifi-msg { text-align: center; font-size: 2vmin; min-height: 2.6vmin; margin-top: 1vmin; }

  /* Band plan switch. The two radios must never share a band, so this offers the
     two valid pairings rather than four independent band choices. */
  .wifi-band { margin: 1.5vmin 0 0.5vmin; padding-top: 1.5vmin;
               border-top: 1px solid #e0e0e0; text-align: center; }
  .band-row { display: flex; align-items: center; justify-content: center;
              gap: 2vmin; flex-wrap: wrap; }
  .band-current { font-size: 2.1vmin; color: #333; white-space: nowrap; }
  .band-current b { color: #1a73e8; font-weight: 700; }
  #bandToggle { font-size: 2vmin; padding: 0.8vmin 2.2vmin; border: 2px solid #c2c2c2;
                border-radius: 1vmin; background: #f3f3f3; color: #111; white-space: nowrap; }
  #bandToggle:focus { outline: none; border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26,115,232,.35); }
  #bandToggle:disabled { color: #9aa0a6; background: #f6f6f6; border-color: #e2e2e2; }
  .band-hint { font-size: 1.7vmin; color: #777; margin-top: 0.8vmin; }
  .band-hint:empty { display: none; }   /* reserve no space when it has nothing to say */
  .band-hint.warn { color: #c1121f; }

  /* USB wheel setup — the second tab of the same card, so it deliberately looks
     and behaves identically to the Wi-Fi one. */
  .whl-dev { font-size: 2.2vmin; text-align: center; color: #555; margin-bottom: 2vmin; }
  .whl-dev b { color: #111; }
  .whl-rows { border: 2px solid #ccc; border-radius: 1vmin; background: #fff; }
  .whl-row { display: flex; align-items: center; gap: 1.5vmin; padding: 1.1vmin 1.6vmin;
             font-size: 2.2vmin; border-bottom: 1px solid #eee; }
  .whl-row:last-child { border-bottom: none; }
  .whl-row.sel { background: #e8f0fe; }
  .whl-row .role { width: 11ch; font-weight: 600; }
  .whl-row .code { width: 13ch; color: #1a73e8; font-weight: 600; font-size: 2vmin; }
  .whl-row .code.unset { color: #c1121f; }
  .whl-row .act { flex: 1; color: #777; font-size: 1.8vmin; }
  /* Bipolar bar: the fill grows left or right from a centre tick, so a steering
     axis reading backwards is visible at a glance rather than only at full lock. */
  .bar { position: relative; width: 26vmin; height: 1.8vmin; background: #eee;
         border-radius: 0.9vmin; overflow: hidden; flex: none; }
  .bar i { position: absolute; top: 0; bottom: 0; background: #1a73e8; display: block; }
  .bar::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0;
                width: 1px; background: #bbb; }
  .whl-axes { margin-top: 2vmin; max-height: 30vh; overflow-y: auto;
              border-top: 1px solid #e0e0e0; padding-top: 1.5vmin; }
  .whl-axis { display: flex; align-items: center; gap: 1.5vmin; font-size: 1.9vmin;
              padding: 0.4vmin 1.6vmin; color: #444; }
  .whl-axis.hot { background: #fff4e5; border-radius: 0.6vmin; font-weight: 700; }
  .whl-axis .an { width: 15ch; }
  .whl-axis .ex { width: 8ch; color: #999; font-size: 1.6vmin; text-align: right; }

  /* Software update prompt. Same shell as the two setup overlays, but above them
     (z-index 20): it can appear while somebody is mid-way through Wi-Fi or wheel
     setup, and half a dialog behind another is worse than either. */
  #update { position: fixed; inset: 0; z-index: 20; display: flex;
            align-items: center; justify-content: center;
            background: rgba(255, 255, 255, 0.98);
            font-family: system-ui, "DejaVu Sans", sans-serif; color: #1a1a1a; }
  #update.update-hidden { display: none; }
  .upd-vers { font-size: 4.2vmin; font-weight: 700; text-align: center; margin: 1vmin 0 2vmin; }
  .upd-vers .from { color: #777; }
  .upd-vers .arrow { color: #777; margin: 0 1.5vmin; }
  .upd-vers .to { color: #1a73e8; }
  .upd-notes { font-size: 2vmin; color: #555; text-align: center; margin-bottom: 2vmin;
               max-height: 20vh; overflow-y: auto; }
  .upd-notes:empty { display: none; }
  /* Keys, not buttons, are the primary affordance: the box is driven from a
     keyboard across a room and there is usually no mouse (see the udev rule). */
  .upd-keys { display: flex; gap: 3vmin; justify-content: center; margin: 2vmin 0; }
  .upd-key { font-size: 2.4vmin; padding: 1.2vmin 3vmin; border: 2px solid #c2c2c2;
             border-radius: 1vmin; background: #f3f3f3; }
  .upd-key b { font-size: 3vmin; color: #1a73e8; }
  .upd-count { text-align: center; font-size: 2.2vmin; color: #555; }
  .upd-count b { color: #111; font-variant-numeric: tabular-nums; }
  /* Full-width progress bar; .bar itself is fixed-width for the wheel axes. */
  .upd-bar { width: 100%; margin: 2vmin 0 1vmin; }
  .upd-warn { text-align: center; font-size: 2.4vmin; color: #c1121f; font-weight: 700;
              margin-top: 2vmin; }
</style>
</head>
<body>
<div id="overlay">
  <div id="statusbar">
    <div id="title">Waiting for a headset…</div>
    <div id="sub"></div>
    <div id="join"></div>
    <div id="uplink"></div>
  </div>
  <div id="version"></div>
</div>

<!-- Burn-in screensaver; shown after the screen has been unchanged for a while -->
<div id="saver">
  <div id="sv-a" class="sv"></div>
  <div id="sv-d2" class="sv"></div>
  <div id="sv-txt" class="sv"></div>
</div>

<!-- Adiona-TV settings, opened with F12 (keyboard-only).
     F12 is the ONLY key this box keeps for itself: while a headset is subscribed
     the keyboard is grabbed and every other keystroke goes to the headset, so
     there is no room for a per-screen hotkey any more. See adiona_keys.py.

     The wheel tab lives here rather than in the headset because the person
     mapping a wheel is standing at this box with the wheel in their hands, and
     this is a big screen. The headset never learns anything about the device. -->
<div id="settings" class="settings-hidden">
  <div class="wifi-card">
    <div class="set-tabs" role="tablist" aria-label="Adiona-TV settings">
      <button id="tabWifi" class="set-tab on" role="tab" aria-selected="true"
              aria-controls="paneWifi">Internet Wi-Fi</button>
      <button id="tabWheel" class="set-tab" role="tab" aria-selected="false"
              aria-controls="paneWheel">Steering wheel</button>
      <span class="set-hint">← → switch tab &nbsp;·&nbsp; Esc close</span>
    </div>

    <div id="paneWifi" class="set-pane" role="tabpanel" aria-labelledby="tabWifi">
      <div class="wifi-note">
        Connects this box to an existing Wi-Fi for <b>internet</b> (repeater) via the USB adapter.<br>
        This is <b>not</b> the headset network <b id="wifiApName">Adiona-TV</b> — that one stays fixed.
      </div>
      <div id="wifiList" class="wifi-list" tabindex="0" role="listbox"
           aria-label="Available and saved networks"></div>
      <div class="wifi-fields">
        <label>Network (SSID)
          <input id="wifiSsid" type="text" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
        <label>Password (blank = use saved)
          <input id="wifiPass" type="password" autocomplete="off"></label>
      </div>
      <div class="wifi-btns">
        <button id="wifiConnect">Connect</button>
        <button id="wifiForget">Forget</button>
        <button id="wifiRescan">Rescan</button>
        <button id="wifiClose">Close (Esc)</button>
      </div>
      <div class="wifi-band">
        <div class="band-row">
          <span id="bandCurrent" class="band-current"></span>
          <button id="bandToggle">Switch</button>
        </div>
        <!-- Carries text ONLY when it says something the operator needs: the
             reason the switch is unavailable, or the confirm warning. Empty and
             collapsed the rest of the time. -->
        <div id="bandHint" class="band-hint"></div>
      </div>
      <div id="wifiMsg" class="wifi-msg"></div>
    </div>

    <div id="paneWheel" class="set-pane pane-hidden" role="tabpanel" aria-labelledby="tabWheel">
      <div id="whlDev" class="whl-dev"></div>
      <div id="whlRows" class="whl-rows" tabindex="0" role="listbox"
           aria-label="Wheel axis assignments"></div>
      <div id="whlAxes" class="whl-axes"></div>
      <div class="wifi-btns">
        <button id="whlSave">Save (S)</button>
        <button id="whlClose">Close (Esc)</button>
      </div>
      <div id="whlMsg" class="wifi-msg"></div>
    </div>
  </div>
</div>

<!-- Software update prompt. Driven entirely by adiona-updater.py through
     /state.update — this page decides nothing about updates, it only shows the
     question and relays the answer. It cannot name a version or a URL of its own;
     see update_command() in adiona_controller.py. -->
<div id="update" class="update-hidden">
  <div class="wifi-card">
    <div id="updTitle" class="wifi-title">Software update available</div>
    <div id="updVers" class="upd-vers"></div>
    <div id="updNotes" class="upd-notes"></div>
    <div id="updBody"></div>
    <div id="updMsg" class="wifi-msg"></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var overlay = document.getElementById("overlay");
  var elTitle = document.getElementById("title");
  var elSub = document.getElementById("sub");
  var elJoin = document.getElementById("join");
  var elUplink = document.getElementById("uplink");
  var elVersion = document.getElementById("version");

  var state = { mode: "waiting", target: null, target_name: null,
                ssid: "", passphrase: "", uplink: {} };

  // ── Overlay ───────────────────────────────────────────────────────────────
  function dot(stateStr) {
    var cls = stateStr === true ? "ok" : (stateStr === false ? "no" : "unk");
    return '<span class="dot ' + cls + '"></span>';
  }

  // This page only ever draws the non-live screen; the native player covers it
  // once video is flowing. So there is nothing to hide here — the two states are:
  //   • headset present  → "Connecting…" (visible only in the moment before the
  //     player maps its surface; if it lingers, the player failed to start and
  //     this message is the diagnostic).
  //   • no headset       → the waiting splash with join info.
  function renderOverlay() {
    var present = !!state.target;

    if (present) {
      elTitle.textContent = "Connecting…";
      elSub.textContent = state.target_name ? ("to " + state.target_name) : "";
      elJoin.innerHTML = "";
    } else {
      elTitle.textContent = "Waiting for a headset…";
      elSub.textContent = "Power on the headset and start Live Stream.";
      if (state.ssid) {
        elJoin.innerHTML = "On the headset, join Wi-Fi <b>" + esc(state.ssid) + "</b>" +
          (state.passphrase ? " &nbsp;·&nbsp; password <b>" + esc(state.passphrase) + "</b>" : "");
      } else { elJoin.innerHTML = ""; }
    }

    var up = state.uplink || {};
    var net = up.internet;
    var how = up.via === "wifi" ? ("Wi-Fi: " + (up.wifi_ssid || "")) :
              up.via === "ethernet" ? "Ethernet" : null;
    var line = net === true ? (dot(true) + "Internet via " + esc(how || "uplink")) :
               net === false ? (dot(false) + "No internet (local network only)") :
               (dot(null) + "Internet status unknown");
    var hint = "&nbsp;&nbsp;&nbsp;<span class='hint'>Keyboard: press F12 for settings</span>";

    // Wheel line. Worth its own row on the splash: at an event the first thing
    // that goes wrong is a wheel that did not enumerate, and this answers it
    // from across the room without an SSH session.
    var wh = state.wheel || {};
    var wline = "";
    if (wh.present) {
      wline = "<br>" + dot(!!wh.mapped) + "Wheel: <b>" + esc(wh.name || "unknown") + "</b>" +
        (wh.range_deg ? (" &nbsp;·&nbsp; " + wh.range_deg + "°") : "") +
        (wh.mapped ? "" : " &nbsp;·&nbsp; not mapped");
    }
    elUplink.innerHTML = line + hint + wline;
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  // ── Screensaver ───────────────────────────────────────────────────────────
  // Activates once nothing on screen has changed for IDLE_MS. "Changed" is
  // measured from the content actually rendered, not from a timer that anything
  // could reset: the box sits on the waiting screen unattended for hours, and
  // that is exactly the case that burns in.
  var IDLE_MS = 3 * 60 * 1000;
  var SAVER_FPS = 20;                  // see saverTick - deliberately not 60
  var SAVER_FRAME_MS = 1000 / SAVER_FPS;
  var saver = document.getElementById("saver");
  var svItems = [
    // Distinct directions AND distinct speeds. Equal speeds would trace a
    // repeating figure and re-burn the same track; unequal ones never close.
    // `sp` is vw per second, so motion looks the same on a 1080p or a 4K panel.
    // `place` is the starting position as a fraction of the free space - chosen
    // so the three do not overlap at t=0, which the collision code assumes.
    { el: document.getElementById("sv-a"),   dx:  1.00, dy:  0.66, sp: 3.18, place: [0.05, 0.05] },
    { el: document.getElementById("sv-d2"),  dx: -0.82, dy:  1.00, sp: 2.55, place: [0.95, 0.10] },
    { el: document.getElementById("sv-txt"), dx:  0.90, dy: -1.00, sp: 2.08, place: [0.50, 0.95] }
  ];

  function svClamp(it, W, H) {
    it.x = Math.max(0, Math.min(it.x, W - it.w));
    it.y = Math.max(0, Math.min(it.y, H - it.h));
  }
  var saverOn = false, rafId = 0, lastFrameT = 0;
  var lastChangeMs = Date.now(), lastSig = null;

  function noteActivity() { lastChangeMs = Date.now(); saverStop(); }

  function saverStart() {
    if (saverOn) return;
    saverOn = true;
    saver.classList.add("on");                // must be displayed before measuring
    var W = window.innerWidth, H = window.innerHeight, vwpx = W / 100;
    svItems.forEach(function (it) {
      var r = it.el.getBoundingClientRect();
      it.w = r.width; it.h = r.height;
      it.x = Math.max(0, (W - it.w) * it.place[0]);
      it.y = Math.max(0, (H - it.h) * it.place[1]);
      // Velocity is carried as px/second from here on, because a collision
      // exchanges velocity components between two elements and a direction +
      // speed pair cannot represent the result.
      var m = Math.sqrt(it.dx * it.dx + it.dy * it.dy);
      it.vx = it.dx / m * it.sp * vwpx;
      it.vy = it.dy / m * it.sp * vwpx;
    });
    lastFrameT = 0;
    rafId = requestAnimationFrame(saverTick);
  }

  function saverStop() {
    if (!saverOn) return;
    saverOn = false;
    saver.classList.remove("on");
    cancelAnimationFrame(rafId);
  }

  function saverTick(t) {
    if (!saverOn) return;
    rafId = requestAnimationFrame(saverTick);

    // Run the animation at SAVER_FPS, not at the display's refresh rate. Nothing
    // here needs 60 fps - the elements drift at a few tens of px/s - and this is
    // a Pi driving a TV that sits idle for hours, so two thirds of the
    // compositing work is two thirds of the heat for no visible difference.
    // Returning early leaves the transforms untouched, so no recomposite happens
    // on the skipped frames.
    if (!lastFrameT) lastFrameT = t;
    var elapsed = t - lastFrameT;
    if (elapsed < SAVER_FRAME_MS) return;
    // Clamp only against real stalls (a throttled tab), not against ordinary
    // frame jitter - clamping near the frame interval would quietly slow
    // everything down. 0.25 s of travel is ~15 px, far too little to tunnel
    // through anything.
    var dt = Math.min(0.25, elapsed / 1000);
    lastFrameT = t;
    var W = window.innerWidth, H = window.innerHeight;

    svItems.forEach(function (it) {
      it.x += it.vx * dt;
      it.y += it.vy * dt;
      if (it.x < 0) { it.x = 0; it.vx = -it.vx; }
      else if (it.x > W - it.w) { it.x = W - it.w; it.vx = -it.vx; }
      if (it.y < 0) { it.y = 0; it.vy = -it.vy; }
      else if (it.y > H - it.h) { it.y = H - it.h; it.vy = -it.vy; }
    });

    // Element vs element, so they bounce off each other instead of sliding
    // through. Separate along the axis of LEAST penetration (the axis they are
    // most nearly clear on, i.e. the one they actually met on), then exchange
    // velocity on that axis: the equal-mass elastic result, which sends them
    // apart without adding or removing energy. Separation can push an element
    // past a wall, so re-clamp; any residue resolves next frame, since the
    // velocities now point away from each other.
    for (var i = 0; i < svItems.length; i++) {
      for (var j = i + 1; j < svItems.length; j++) {
        var a = svItems[i], b = svItems[j];
        var px = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
        var py = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
        if (px <= 0 || py <= 0) continue;
        var t;
        if (px < py) {
          var sx = (a.x < b.x ? -1 : 1) * px / 2;
          a.x += sx; b.x -= sx;
          t = a.vx; a.vx = b.vx; b.vx = t;
        } else {
          var sy = (a.y < b.y ? -1 : 1) * py / 2;
          a.y += sy; b.y -= sy;
          t = a.vy; a.vy = b.vy; b.vy = t;
        }
        svClamp(a, W, H); svClamp(b, W, H);
      }
    }

    svItems.forEach(function (it) {
      it.el.style.transform = "translate(" + it.x.toFixed(1) + "px," + it.y.toFixed(1) + "px)";
    });
  }                                    // next frame was already queued at the top

  // ── Keep the splash on screen ─────────────────────────────────────────────
  // #overlay draws splash.png as a CSS background, and a CSS background that
  // fails to load is never retried by the browser - one refused connection and
  // the box shows a white screen with only the status bar for the rest of the
  // day. That is not hypothetical: it is what a mid-apply reload produced. The
  // page cannot see a background fail, so probe the same URL with an Image and
  // re-point the background at a cache-busting URL when it comes back.
  var splashTries = 0;
  function ensureSplash() {
    var probe = new Image();
    probe.onload = function () {
      if (splashTries) {
        overlay.style.backgroundImage = 'url("' + probe.src + '")';
      }
    };
    probe.onerror = function () {
      // Back off to every 10 s; the controller restarts in well under that, and
      // this keeps running for as long as the box is up.
      setTimeout(ensureSplash, Math.min(1000 * ++splashTries, 10000));
    };
    probe.src = splashTries ? "splash.png?r=" + splashTries : "splash.png";
  }
  ensureSplash();

  // ── Poll the controller for what to display ───────────────────────────────
  // The version this page was served with. An update that swaps the release
  // under a running controller leaves Chromium showing the OLD index.html, and
  // nothing else would ever reload it — so a version change IS the reload signal.
  // Cheap and exact: the page is served with Cache-Control: no-store, so a reload
  // always fetches the new one, and most updates therefore cost a sub-second
  // refresh instead of a ten-second kiosk restart.
  var loadedVersion = null;
  var pollFailures = 0;

  function poll() {
    // ?ui=1 identifies this as the PAGE polling, not kiosk-session.sh, which
    // fetches the same endpoint. The controller only believes the settings panel
    // is open — and only keeps the video suspended for it — while these keep
    // arriving, so a crashed or reloading page cannot black out the box.
    fetch("/state?ui=1", { cache: "no-store" }).then(function (r) { return r.json(); })
      .then(function (s) {
        state = s;
        // Two reasons to reload, both meaning "the HTML behind us may have
        // changed": the version moved (an update swapped the release), or the
        // controller went away and came back (a restart — which deploy.ps1 does
        // on every deploy, usually without a version bump). Both are checked only
        // on a SUCCESSFUL fetch, so a reload can never land on an error page.
        var cameBack = pollFailures >= 10;
        pollFailures = 0;
        // ...but NOT while an update is still being applied. The swap flips
        // VERSION several steps before the applier restarts the controller, so a
        // reload here loads index.html from a controller that is about to go
        // away, and the splash.png request a moment later lands in the restart.
        // A CSS background that fails is never retried: the box came up on the
        // new version with a blank white screen. Wait for a terminal state - the
        // controller is back up by then, and the reload is a plain refresh.
        var us = (s.update || {}).state;
        var applying = us === "applying" || us === "health" || us === "staged";
        if (loadedVersion === null) {
          loadedVersion = s.version || "";
        } else if (!applying && (cameBack || (s.version && s.version !== loadedVersion))) {
          location.reload();
          return;
        }
        elVersion.textContent = s.version ? ("Adiona-TV v" + s.version) : "";
        renderOverlay();
        renderUpdate(s.update);

        // Signature of everything the waiting screen draws. Any change to it is
        // a visible change, and restarts the idle countdown.
        var up = s.uplink || {};
        var wh = s.wheel || {};
        var ud = s.update || {};
        var sig = [s.mode, s.target, s.target_name, s.ssid, s.passphrase, s.version,
                   s.casting, up.internet, up.via, up.wifi_ssid, up.ethernet,
                   up.wifi_present,
                   // Summary fields only. Axis values change constantly and would
                   // keep the idle countdown permanently reset — the very case
                   // the screensaver exists for.
                   wh.present, wh.name, wh.range_deg, wh.mapped,
                   // Update state, but NOT progress or the countdown: those move
                   // every poll and would defeat the idle detection entirely.
                   ud.state, ud.available].join("|");
        if (sig !== lastSig) { lastSig = sig; noteActivity(); }

        // Never over a live stream: the player's surface covers this page, so it
        // would be invisible work, and the picture is moving anyway. Nor over the
        // update prompt — burning in for three minutes is a smaller problem than
        // hiding a question that installs software.
        if (!settingsOpen && !updateOpen && !s.casting &&
            (Date.now() - lastChangeMs) > IDLE_MS) saverStart();
      })
      .catch(function () {
        // Controller momentarily down; keep the last state on screen. Deliberately
        // NOT a reload: while the controller is down a reload replaces a stale but
        // perfectly recoverable page with Chromium's connection-error page, which
        // has no way back — kiosk-session.sh passes the URL once and never reloads
        // it. Counting here and reloading on the way back up is the safe half.
        pollFailures++;
      });
  }

  // ── Upstream Wi-Fi tab (keyboard-only: arrows/Tab/Enter) ──────────────────
  var wifiListEl = document.getElementById("wifiList");
  var elSsid = document.getElementById("wifiSsid");
  var elPass = document.getElementById("wifiPass");
  var elWifiMsg = document.getElementById("wifiMsg");
  var elApName = document.getElementById("wifiApName");
  var wifiItems = [], wifiSel = 0;

  function wifiPost(p) {
    return fetch("/wifi", { method: "POST", body: JSON.stringify(p) }).then(function (r) { return r.json(); });
  }
  function msg(text, color) { elWifiMsg.style.color = color || "#555"; elWifiMsg.textContent = text; }

  function renderList() {
    if (!wifiItems.length) {
      wifiListEl.innerHTML = '<div class="wifi-empty">No networks found — press Rescan.</div>'; return;
    }
    wifiListEl.innerHTML = "";
    wifiItems.forEach(function (it, i) {
      var row = document.createElement("div");
      row.className = "wifi-item" + (i === wifiSel ? " sel" : "") + (it.inRange ? "" : " off");
      row.setAttribute("role", "option");
      var sig = it.inRange ? (it.signal + "%") : "—";
      var lock = it.secure ? " 🔒" : "";
      var badge = it.connected ? '<span class="badge conn">connected</span>'
                : it.saved ? '<span class="badge saved">' + (it.inRange ? "saved" : "saved · out of range") + '</span>' : "";
      row.innerHTML = '<span class="sig">' + sig + '</span><span class="name">' + esc(it.ssid) + lock + '</span>' + badge;
      row.addEventListener("click", function () { wifiSel = i; chooseRow(false); });
      wifiListEl.appendChild(row);
    });
  }
  function chooseRow(focusPass) {
    renderList();
    var it = wifiItems[wifiSel];
    if (!it) return;
    elSsid.value = it.ssid;
    var rows = wifiListEl.children;
    if (rows[wifiSel] && rows[wifiSel].scrollIntoView) rows[wifiSel].scrollIntoView({ block: "nearest" });
    if (focusPass) elPass.focus();
  }
  function buildList(w) {
    var inScan = {};
    wifiItems = [];
    (w.scan || []).forEach(function (n) {
      inScan[n.ssid] = true;
      wifiItems.push({ ssid: n.ssid, secure: n.secure, signal: n.signal, inRange: true,
                       saved: (w.saved || []).indexOf(n.ssid) >= 0, connected: n.ssid === w.ssid });
    });
    (w.saved || []).forEach(function (s) {
      if (!inScan[s]) wifiItems.push({ ssid: s, secure: true, signal: 0, inRange: false, saved: true, connected: s === w.ssid });
    });
    wifiItems.sort(function (a, b) {
      if (a.connected !== b.connected) return a.connected ? -1 : 1;
      if (a.inRange !== b.inRange) return a.inRange ? -1 : 1;
      return (b.signal || 0) - (a.signal || 0);
    });
    if (wifiSel >= wifiItems.length) wifiSel = 0;
    renderList();
  }
  // ── Band plan ─────────────────────────────────────────────────────────────
  // The AP and the uplink must never share a band: the two antennas are
  // centimetres apart and the AP deafens the dongle's receiver. So this offers
  // the two valid pairings, not four independent band choices.
  var elBandCurrent = document.getElementById("bandCurrent");
  var elBandToggle = document.getElementById("bandToggle");
  var elBandHint = document.getElementById("bandHint");
  var bandPlan = "ap5", bandArmed = false, bandBusy = false;

  var BAND_TEXT = {
    ap5:  "Headset <b>5 GHz</b> &nbsp;·&nbsp; Internet <b>2.4 GHz</b>",
    ap24: "Headset <b>2.4 GHz</b> &nbsp;·&nbsp; Internet <b>5 GHz</b>"
  };

  function otherPlan() { return bandPlan === "ap5" ? "ap24" : "ap5"; }

  function renderBand(w) {
    if (w) {
      bandPlan = w.band_plan === "ap24" ? "ap24" : "ap5";
      // Only an explicit false blocks the switch. null means "no adapter" or
      // "could not read the capability", where refusing would be worse than
      // letting the operator try - the controller re-checks before applying.
      renderBand.can5 = (w.uplink_5ghz !== false);
      renderBand.present = !!w.present;
    }
    elBandCurrent.innerHTML = BAND_TEXT[bandPlan];

    if (bandBusy) {
      elBandToggle.disabled = true;
      elBandToggle.textContent = "Switching…";
      elBandHint.className = "band-hint";
      elBandHint.textContent = "Reconfiguring the radios - this takes up to a minute.";
      return;
    }

    // Greyed out when the adapter cannot take the uplink on 5 GHz, because the
    // fallback plan puts it there. Switching would kill internet access.
    var blocked = (bandPlan === "ap5" && !renderBand.can5);
    elBandToggle.disabled = blocked;
    elBandHint.className = "band-hint" + (blocked ? " warn" : "");
    elBandToggle.textContent = bandPlan === "ap5"
      ? "Switch to headset 2.4 GHz"
      : "Switch to headset 5 GHz";

    if (blocked) {
      bandArmed = false;
      elBandHint.textContent = renderBand.present
        ? "Unavailable - this USB adapter is 2.4 GHz only, so it cannot take the internet uplink."
        : "Unavailable - no USB Wi-Fi adapter detected.";
      return;
    }

    if (bandArmed) {
      elBandToggle.textContent = "Press again to confirm";
      elBandHint.textContent = "The headset will disconnect and must rejoin the same network name.";
    } else {
      // Nothing to say in the resting state - the row already reads as a
      // statement of the current split plus what the button would change it to.
      elBandHint.textContent = "";
    }
  }

  function doBandSwitch() {
    if (bandBusy || elBandToggle.disabled) return;
    // Two-press confirm: this drops the headset mid-session, and the operator is
    // driving a keyboard on a TV where a stray Enter is easy.
    if (!bandArmed) { bandArmed = true; renderBand(); return; }
    bandArmed = false;
    bandBusy = true;
    renderBand();
    wifiPost({ action: "band_plan", plan: otherPlan() }).then(function (res) {
      bandBusy = false;
      msg(res.message || (res.ok ? "Band plan applied" : "Failed"),
          res.ok ? "#1a7f37" : "#c1121f");
      loadWifi();
    }).catch(function () {
      bandBusy = false;
      msg("Band switch failed.", "#c1121f");
      renderBand();
    });
  }

  elBandToggle.addEventListener("click", doBandSwitch);
  // Leaving the button disarms it, so a confirm cannot be left half-primed.
  elBandToggle.addEventListener("blur", function () {
    if (bandArmed) { bandArmed = false; renderBand(); }
  });

  function loadWifi() {
    return fetch("/wifi", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (w) {
      if (!w.present) msg("No Wi-Fi adapter detected.", "#c1121f");
      buildList(w);
      renderBand(w);
    }).catch(function () {});
  }
  // Entering the Wi-Fi tab: always a fresh scan. A list of networks from the last
  // time someone opened this — possibly a different venue — is worse than none.
  function openWifi() {
    elApName.textContent = state.ssid || "the headset network";
    elSsid.value = ""; elPass.value = ""; wifiSel = 0;
    bandArmed = false;          // never reopen with a confirm still primed
    msg("Scanning…");
    loadWifi();
    wifiPost({ action: "rescan" }).then(function () { msg(""); loadWifi(); }).catch(function () {});
    setTimeout(function () { wifiListEl.focus(); }, 50);
  }
  function doConnect() {
    var ssid = elSsid.value.trim();
    if (!ssid) { msg("Choose or type a network.", "#c1121f"); return; }
    msg("Connecting to " + ssid + "…");
    wifiPost({ action: "connect", ssid: ssid, password: elPass.value }).then(function (res) {
      msg(res.ok ? ("Connected to " + ssid) : ("Failed: " + (res.message || "")), res.ok ? "#1a7f37" : "#c1121f");
      elPass.value = ""; loadWifi();
    }).catch(function () { msg("Request failed.", "#c1121f"); });
  }
  function doForget() {
    var ssid = elSsid.value.trim();
    if (!ssid) { msg("Select a saved network to forget.", "#c1121f"); return; }
    wifiPost({ action: "forget", ssid: ssid }).then(function (res) {
      msg(res.ok ? ("Removed " + ssid) : ("Failed: " + (res.message || "")), res.ok ? "#1a7f37" : "#c1121f");
      loadWifi();
    });
  }
  function doRescan() { msg("Scanning…"); wifiPost({ action: "rescan" }).then(function () { msg(""); loadWifi(); }); }

  wifiListEl.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown") { wifiSel = Math.min(wifiItems.length - 1, wifiSel + 1); chooseRow(false); e.preventDefault(); }
    else if (e.key === "ArrowUp") { wifiSel = Math.max(0, wifiSel - 1); chooseRow(false); e.preventDefault(); }
    else if (e.key === "Enter") { chooseRow(true); e.preventDefault(); }
  });
  elSsid.addEventListener("keydown", function (e) { if (e.key === "Enter") { doConnect(); e.preventDefault(); } });
  elPass.addEventListener("keydown", function (e) { if (e.key === "Enter") { doConnect(); e.preventDefault(); } });
  document.getElementById("wifiConnect").addEventListener("click", doConnect);
  document.getElementById("wifiForget").addEventListener("click", doForget);
  document.getElementById("wifiRescan").addEventListener("click", doRescan);
  document.getElementById("wifiClose").addEventListener("click", function () { settingsShow(false); });

  // ── USB wheel setup tab (keyboard-only: arrows/Enter/S) ───────────────────
  // Two presses per role: Enter arms detection (which zeroes the service's
  // per-axis excursion counters), you move the control, Enter again assigns
  // whichever axis moved most. Detecting by largest excursion rather than by
  // "which axis is non-zero" means a wheel resting off-centre, or a pedal that
  // idles at half scale, cannot be mistaken for the one you just moved.
  var whlRowsEl = document.getElementById("whlRows");
  var whlAxesEl = document.getElementById("whlAxes");
  var elWhlDev = document.getElementById("whlDev");
  var elWhlMsg = document.getElementById("whlMsg");
  var whlSel = 0, whlArmed = false, whlTimer = 0;
  var whl = { present: false, axes: {}, map: {}, range_deg: 900 };

  var WHL_ROLES = [
    { key: "steer", label: "Steering" },
    { key: "gas",   label: "Gas" },
    { key: "brake", label: "Brake" }
  ];
  var WHL_RANGE_ROW = WHL_ROLES.length;          // the range row sits after the roles
  var WHL_CENTRE_ROW = WHL_ROLES.length + 1;     // then the centre row
  var WHL_AC_ROW = WHL_ROLES.length + 2;         // then spring-to-centre strength
  var WHL_LAST_ROW = WHL_AC_ROW;

  function whlPost(p) {
    return fetch("/wheel", { method: "POST", body: JSON.stringify(p) })
      .then(function (r) { return r.json(); });
  }
  function whlMsg(text, color) {
    elWhlMsg.style.color = color || "#555";
    elWhlMsg.textContent = text;
  }

  // The axis that has moved most since the last arm. Null until something has
  // moved meaningfully, so a still wheel never assigns a random axis.
  function hottestAxis() {
    var best = null, bestEx = 0.25;
    for (var code in whl.axes) {
      if (whl.axes[code].excursion > bestEx) { bestEx = whl.axes[code].excursion; best = code; }
    }
    return best;
  }

  function bar(v, bipolar) {
    // v is -1..1 for steering, 0..1 for pedals.
    var pct, left;
    if (bipolar) {
      pct = Math.min(50, Math.abs(v) * 50);
      left = v < 0 ? (50 - pct) : 50;
    } else {
      pct = Math.min(100, Math.max(0, v) * 100); left = 0;
    }
    return '<span class="bar"><i style="left:' + left + '%;width:' + pct + '%"></i></span>';
  }

  function renderWheel() {
    if (!whl.present) {
      elWhlDev.innerHTML = "<b>No wheel detected.</b> Plug a USB wheel into this box.";
      whlRowsEl.innerHTML = ""; whlAxesEl.innerHTML = "";
      return;
    }
    elWhlDev.innerHTML = "<b>" + esc(whl.name || "unknown device") + "</b>" +
      (whl.mapped ? "" : " &nbsp;·&nbsp; not yet mapped");

    var hot = whlArmed ? hottestAxis() : null;
    var rows = "";
    WHL_ROLES.forEach(function (r, i) {
      var m = whl.map ? whl.map[r.key] : null;
      var code = m ? m.code : null;
      var live = (code && whl.axes[code]) ? whl.axes[code].value : 0;
      var act;
      if (whlArmed && i === whlSel) {
        act = hot ? ("detected <b>" + esc(hot) + "</b> — Enter to assign")
                  : "move the control now…";
      } else {
        act = (i === whlSel) ? "Enter to reassign" : "";
      }
      rows += '<div class="whl-row' + (i === whlSel ? " sel" : "") + '">' +
              '<span class="role">' + r.label + '</span>' +
              '<span class="code' + (code ? "" : " unset") + '">' +
                esc(code || "not set") + '</span>' +
              bar(live, r.key === "steer") +
              '<span class="act">' + act + '</span></div>';
    });
    rows += '<div class="whl-row' + (whlSel === WHL_RANGE_ROW ? " sel" : "") + '">' +
            '<span class="role">Range</span>' +
            '<span class="code">' + (whl.range_deg || 900) + '&deg;</span>' +
            '<span class="act">' +
              (whl.range_applied ? "" : "not applied by the driver — ") +
              (whlSel === WHL_RANGE_ROW ? "Enter to switch 900 / 270" : "") +
            '</span></div>';

    // Centre. A wheel whose rest position is not the axis midpoint would pull to
    // one side in the sim forever; this pins dead-ahead to wherever it actually
    // rests. Shows the live offset so it is obvious whether it is needed.
    var offTxt = "";
    if (whl.steer_raw !== null && whl.steer_raw !== undefined) {
      var mid = (whl.centre === null || whl.centre === undefined) ? 32768 : whl.centre;
      var offPct = (whl.steer_raw - mid) / 32768 * 100;
      offTxt = "now " + (offPct >= 0 ? "+" : "") + offPct.toFixed(1) + "% off centre";
    }
    rows += '<div class="whl-row' + (whlSel === WHL_CENTRE_ROW ? " sel" : "") + '">' +
            '<span class="role">Centre</span>' +
            '<span class="code">' +
              ((whl.centre === null || whl.centre === undefined) ? "auto" : esc(String(whl.centre))) +
            '</span>' +
            '<span class="act">' + offTxt +
              (whlSel === WHL_CENTRE_ROW ? " — hands OFF, Enter to set (R resets)" : "") +
            '</span></div>';

    // Spring-to-centre strength. The G920 has no centring of its own, so at 0%
    // the wheel stays wherever it is left and the car holds the turn.
    var acTxt = whl.ff_available === false
      ? "force feedback unavailable on this device"
      : (whlSel === WHL_AC_ROW ? "← → adjust in steps of 10%" : "");
    rows += '<div class="whl-row' + (whlSel === WHL_AC_ROW ? " sel" : "") + '">' +
            '<span class="role">Centring</span>' +
            '<span class="code">' +
              ((whl.autocenter === undefined || whl.autocenter === null) ? "?" : whl.autocenter + "%") +
            '</span>' +
            bar((whl.autocenter || 0) / 100, false) +
            '<span class="act">' + acTxt + '</span></div>';
    whlRowsEl.innerHTML = rows;

    // Every axis, always. If the wrong one gets assigned, this is where it shows.
    var axes = Object.keys(whl.axes).sort();
    whlAxesEl.innerHTML = axes.map(function (code) {
      var a = whl.axes[code];
      return '<div class="whl-axis' + (code === hot ? " hot" : "") + '">' +
             '<span class="an">' + esc(code) + '</span>' + bar(a.value, true) +
             '<span class="ex">' + a.excursion.toFixed(2) + '</span></div>';
    }).join("");
  }

  function loadWheel() {
    return fetch("/wheel", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (w) { whl = w; renderWheel(); })
      .catch(function () {});
  }

  // 10 Hz only while the wheel TAB is the one on screen — not merely while the
  // panel is open. Off the rest of the time: this page sits on a waiting screen
  // for hours and has no business polling then.
  function wheelPolling(on) {
    if (whlTimer) { clearInterval(whlTimer); whlTimer = 0; }
    if (on) whlTimer = setInterval(loadWheel, 100);
  }
  function openWheel() {
    whlSel = 0; whlArmed = false;
    whlMsg("Select a control with ↑ ↓, press Enter, then move it.");
    loadWheel();
    setTimeout(function () { whlRowsEl.focus(); }, 50);
  }

  function whlEnter() {
    if (!whl.present) return;
    if (whlSel === WHL_CENTRE_ROW) {
      whlPost({ action: "centre" }).then(function (res) {
        whlMsg(res.ok ? "Centre set to the wheel's current position. Press S to save."
                      : ("Failed: " + (res.message || "")),
               res.ok ? "#1a7f37" : "#c1121f");
        loadWheel();
      });
      return;
    }
    if (whlSel === WHL_RANGE_ROW) {
      var next = (whl.range_deg === 270) ? 900 : 270;
      whlPost({ action: "range", deg: next }).then(function (res) {
        whlMsg(res.ok ? ("Range set to " + next + "°") : ("Failed: " + (res.message || "")),
               res.ok ? "#1a7f37" : "#c1121f");
        loadWheel();
      });
      return;
    }
    var role = WHL_ROLES[whlSel];
    if (!whlArmed) {
      whlArmed = true;
      whlMsg("Move the " + role.label.toLowerCase() + " control through its full travel.");
      whlPost({ action: "arm" }).then(loadWheel);
      return;
    }
    var code = hottestAxis();
    if (!code) { whlMsg("Nothing moved yet — move the control.", "#c1121f"); return; }
    whlArmed = false;
    whlPost({ action: "assign", role: role.key, code: code }).then(function (res) {
      whlMsg(res.ok ? (role.label + " → " + code + ". Press S to save.")
                    : ("Failed: " + (res.message || "")),
             res.ok ? "#1a7f37" : "#c1121f");
      loadWheel();
    });
  }

  function whlSave() {
    whlPost({ action: "save" }).then(function (res) {
      whlMsg(res.ok ? "Saved. This wheel is now recognised automatically."
                    : ("Failed: " + (res.message || "")),
             res.ok ? "#1a7f37" : "#c1121f");
    });
  }

  whlRowsEl.addEventListener("keydown", function (e) {
    if (e.key === "ArrowDown") { whlSel = Math.min(WHL_LAST_ROW, whlSel + 1); whlArmed = false; renderWheel(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { whlSel = Math.max(0, whlSel - 1); whlArmed = false; renderWheel(); e.preventDefault(); }
    else if (e.key === "Enter") { whlEnter(); e.preventDefault(); }
    else if ((e.key === "ArrowLeft" || e.key === "ArrowRight") && whlSel === WHL_AC_ROW) {
      var step = (e.key === "ArrowRight") ? 10 : -10;
      var next = Math.max(0, Math.min(100, (whl.autocenter || 0) + step));
      whlPost({ action: "autocenter", pct: next }).then(function (res) {
        whlMsg(res.ok ? ("Centring " + next + "% — turn the wheel and let go to feel it. S to save.")
                      : ("Failed: " + (res.message || "")),
               res.ok ? "#1a7f37" : "#c1121f");
        loadWheel();
      });
      e.preventDefault();
    }
    else if ((e.key === "r" || e.key === "R") && whlSel === WHL_CENTRE_ROW) {
      whlPost({ action: "centre_reset" }).then(function () {
        whlMsg("Centre reset to the axis midpoint."); loadWheel();
      });
      e.preventDefault();
    }
  });
  document.getElementById("whlSave").addEventListener("click", whlSave);
  document.getElementById("whlClose").addEventListener("click", function () { settingsShow(false); });

  // ── The settings panel itself (F12) ───────────────────────────────────────
  // F12 does NOT arrive here as a keypress. While a headset is subscribed the
  // wheel service holds the keyboard exclusively — that is exactly what lets
  // every other key reach the headset — so Chromium sees nothing at all. The
  // reader counts F12 presses instead and this page follows that counter.
  //
  // It follows the COUNTER rather than an open/closed flag on purpose: when the
  // keyboard is NOT grabbed (no headset, panel already open, update prompt up)
  // Chromium receives the very same F12, and a flag would be toggled twice.
  var settingsEl = document.getElementById("settings");
  var TABS = ["wifi", "wheel"];
  var paneEls = { wifi: document.getElementById("paneWifi"),
                  wheel: document.getElementById("paneWheel") };
  var tabEls = { wifi: document.getElementById("tabWifi"),
                 wheel: document.getElementById("tabWheel") };
  var settingsOpen = false, settingsTab = "wifi";

  // Tell the box what the panel is doing. The reader cannot see Esc or a mouse
  // click once it has let go of the keyboard, so this is the only way it learns
  // the panel closed and can take the keys back — and it is what
  // kiosk-session.sh watches to suspend the video while the panel is up.
  function uiReport() {
    fetch("/ui", { method: "POST",
                   body: JSON.stringify({ open: settingsOpen, tab: settingsTab }) })
      .catch(function () {});
  }

  function setTab(tab) {
    if (TABS.indexOf(tab) < 0) tab = "wifi";
    settingsTab = tab;
    TABS.forEach(function (t) {
      paneEls[t].classList.toggle("pane-hidden", t !== tab);
      tabEls[t].classList.toggle("on", t === tab);
      tabEls[t].setAttribute("aria-selected", t === tab ? "true" : "false");
    });
    wheelPolling(settingsOpen && tab === "wheel");
    if (!settingsOpen) return;
    if (tab === "wifi") openWifi(); else openWheel();
    uiReport();
  }

  function settingsShow(open, tab) {
    settingsOpen = open;
    settingsEl.classList.toggle("settings-hidden", !open);
    if (open) {
      setTab(tab || settingsTab);            // reports on our behalf
    } else {
      wheelPolling(false);
      uiReport();
    }
  }

  function cycleTab(dir) {
    var i = TABS.indexOf(settingsTab);
    setTab(TABS[(i + dir + TABS.length) % TABS.length]);
  }

  tabEls.wifi.addEventListener("click", function () { setTab("wifi"); });
  tabEls.wheel.addEventListener("click", function () { setTab("wheel"); });

  // Long poll. Deliberately not a fast repeating one: this box sits on its
  // waiting screen for hours and has no business generating traffic then, which
  // is the same reason the wheel tab only polls while it is on screen.
  // uiReader false means that counter cannot move — the wheel service is down,
  // the keyboard module failed to import, or KEYS_ENABLED=0. Nothing is holding
  // the keyboard in that case, so F12 reaches this page and we act on it here
  // instead. Without this fallback a broken keyboard bridge would take the Wi-Fi
  // setup with it, which is the one screen that must never become unreachable.
  var uiSeq = -1, uiReader = false;
  function uiPoll() {
    fetch("/ui?seq=" + uiSeq + "&reader=" + (uiReader ? "1" : "0"), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (u) {
        uiReader = !!u.reader;
        var seq = u.panel_seq || 0;
        // uiSeq < 0 is the first answer: it only establishes where the counter
        // is. A box that has been running for hours must not open the panel
        // just because this page reloaded. A counter that went BACKWARDS means
        // the wheel service restarted, which is a resync and not a keypress.
        if (uiSeq >= 0 && seq > uiSeq && (seq - uiSeq) % 2 === 1) {
          // Parity, because presses can arrive faster than this page re-arms.
          settingsShow(!settingsOpen);
        }
        uiSeq = seq;
        setTimeout(uiPoll, 0);
      })
      .catch(function () { setTimeout(uiPoll, 1000); });
  }

  // ── Software update prompt ────────────────────────────────────────────────
  // The updater owns every decision here: whether there is an update, whether now
  // is a moment to ask, and when the offer lapses. This renders what it says and
  // posts back Y or N. Keeping the deadline on the updater's side (a monotonic
  // clock in a process that outlives this page) is what makes it survive a
  // reload — a countdown held in the page would restart every time Chromium did.
  var updateEl = document.getElementById("update");
  var elUpdTitle = document.getElementById("updTitle");
  var elUpdVers = document.getElementById("updVers");
  var elUpdNotes = document.getElementById("updNotes");
  var elUpdBody = document.getElementById("updBody");
  var elUpdMsg = document.getElementById("updMsg");
  var updateOpen = false;
  var upd = { state: "idle" };
  // /state arrives at 1 Hz but the countdown must not visibly stutter, so the
  // number is interpolated locally between polls and re-synced on every one.
  var updDeadlineMs = 0;

  function updPost(p) {
    return fetch("/update", { method: "POST", body: JSON.stringify(p) })
      .then(function (r) { return r.json(); });
  }

  function updShow(open) {
    updateOpen = open;
    updateEl.classList.toggle("update-hidden", !open);
  }

  // Which states are worth covering the screen for. "available" is not among
  // them: it means the updater has found something but has not decided this is a
  // moment to ask (a headset is connected, say).
  function updVisible(u) {
    return u.state === "prompting" || u.state === "downloading" ||
           u.state === "verifying" || u.state === "staged" ||
           u.state === "applying"  || u.state === "health" ||
           u.state === "ok"        || u.state === "failed";
  }

  function updCountdown() {
    if (upd.state !== "prompting") return 0;
    return Math.max(0, Math.round((updDeadlineMs - Date.now()) / 1000));
  }

  function renderUpdate(next) {
    var prev = upd;
    upd = next || { state: "idle" };

    if (upd.state === "prompting") {
      // Re-sync only when the updater's own number moves, so the local
      // interpolation is not yanked back a fraction of a second every poll.
      if (prev.state !== "prompting" || prev.expires_in !== upd.expires_in) {
        updDeadlineMs = Date.now() + (upd.expires_in || 0) * 1000;
      }
    } else {
      updDeadlineMs = 0;
    }

    var visible = updVisible(upd);
    if (visible !== updateOpen) updShow(visible);
    if (!visible) return;

    // "from" only exists while an apply is in flight, and it is the only correct
    // left-hand side then: the swap flips VERSION - and so "current" - long
    // before the install finishes.
    var cur = esc(upd.from || upd.current || state.version || "");
    var to = esc(upd.available || "");
    var versLine = to
      ? '<span class="from">v' + cur + '</span><span class="arrow">&rarr;</span>' +
        '<span class="to">v' + to + '</span>'
      : "";

    elUpdNotes.textContent = "";
    elUpdMsg.textContent = "";

    if (upd.state === "prompting") {
      elUpdTitle.textContent = "Software update available";
      elUpdVers.innerHTML = versLine;
      elUpdNotes.textContent = upd.notes || "";
      elUpdBody.innerHTML =
        '<div class="upd-keys">' +
          '<span class="upd-key"><b>Y</b> &nbsp;Update now</span>' +
          '<span class="upd-key"><b>N</b> &nbsp;Not now</span>' +
        '</div>' +
        '<div class="upd-count">Closing in <b id="updSecs">' + updCountdown() + '</b> s' +
        ' &nbsp;·&nbsp; no answer means no update</div>';
      return;
    }

    if (upd.state === "downloading" || upd.state === "verifying") {
      elUpdTitle.textContent = upd.state === "verifying"
        ? "Checking the download" : "Downloading update";
      elUpdVers.innerHTML = versLine;
      var pct = Math.round((upd.progress || 0) * 100);
      elUpdBody.innerHTML =
        '<div class="bar upd-bar"><i style="left:0;width:' + pct + '%"></i></div>' +
        '<div class="upd-count"><b>' + pct + '</b>%</div>';
      return;
    }

    if (upd.state === "staged" || upd.state === "applying" || upd.state === "health") {
      elUpdTitle.textContent = upd.state === "staged"
        ? "Ready to install" : "Installing update";
      elUpdVers.innerHTML = versLine;
      elUpdBody.innerHTML = "";
      // The single most important line on this screen. Without it the operator
      // sees an install that appears to hang and pulls the power — exactly the
      // failure the rollback machinery exists to survive, and the one case where
      // recovering costs a reboot.
      //
      // It used to promise the display would go black. It usually does not: the
      // Pi holds the last frame, and most updates do not restart the kiosk at all
      // (the applier only does that when the kiosk files actually changed). The
      // duration is the part worth saying, because the health soak alone is 90
      // seconds and silence for that long reads as a hang.
      elUpdMsg.innerHTML = upd.state === "staged"
        ? esc(upd.message || "Waiting for the session to end.")
        : '<span class="upd-warn">Do not remove power.' +
          '<br>This takes a minute or two.</span>';
      return;
    }

    // ok / failed — a short-lived banner the updater clears on its own.
    elUpdTitle.textContent = upd.state === "ok" ? "Update complete" : "Update failed";
    elUpdVers.innerHTML = upd.state === "ok" && to
      ? '<span class="to">v' + to + '</span>'
      : '<span class="to">v' + esc(state.version || upd.current || "") + '</span>';
    elUpdBody.innerHTML = "";
    elUpdMsg.textContent = upd.message ||
      (upd.state === "ok" ? "" : "The box is still running its previous version.");
  }

  // Tick the displayed number between polls. Cheap: one text node, once a second,
  // and only while the prompt is up.
  setInterval(function () {
    if (!updateOpen || upd.state !== "prompting") return;
    var el = document.getElementById("updSecs");
    if (el) el.textContent = updCountdown();
  }, 250);

  function updAnswer(accept) {
    var version = upd.available || "";
    updPost({ action: accept ? "accept" : "decline", version: version });
    // Optimistic, so the screen reacts to the keypress immediately rather than
    // on the next poll. The updater's own state overwrites this within a second.
    elUpdMsg.textContent = accept ? "Starting the update…" : "Not now.";
    if (!accept) updShow(false);
  }

  document.addEventListener("keydown", function (e) {
    // Someone is at the keyboard: dismiss the screensaver and restart the
    // countdown before anything else looks at the key.
    noteActivity();
    // F12 belongs to the box, never to the browser and never to a dialog on this
    // page. Normally the toggle arrives through /ui — the reader sees the key
    // even when Chromium cannot — and acting on it here as well would toggle
    // twice in the states where we do receive it. The exception is a reader that
    // is not running at all, where this is the only way in.
    if (e.key === "F12") {
      e.preventDefault();
      if (!uiReader) settingsShow(!settingsOpen);
      return;
    }
    // The update prompt is checked FIRST and swallows everything. It is drawn
    // over the settings panel, and the settingsOpen branch below returns early —
    // so anywhere later in this chain its Y/N would be eaten by whatever dialog
    // happens to be open underneath.
    if (updateOpen) {
      if (upd.state === "prompting") {
        if (e.key === "y" || e.key === "Y") { updAnswer(true); e.preventDefault(); }
        else if (e.key === "n" || e.key === "N" || e.key === "Escape") {
          updAnswer(false); e.preventDefault();
        }
      } else if (e.key === "Escape" && (upd.state === "ok" || upd.state === "failed")) {
        updShow(false); e.preventDefault();     // dismiss the result banner early
      }
      // Everything else is deliberately dropped: nothing may act underneath a
      // question that is about to install software.
      return;
    }
    if (settingsOpen) {
      if (e.key === "Escape") { settingsShow(false); e.preventDefault(); }
      else if ((e.key === "s" || e.key === "S") && settingsTab === "wheel") {
        whlSave(); e.preventDefault();
      } else if ((e.key === "ArrowLeft" || e.key === "ArrowRight") &&
                 !e.defaultPrevented && !isTextField(e.target)) {
        // Tab switching is on the arrows, NOT on Tab: Tab is the only way to
        // reach the password field. defaultPrevented is what gives the controls
        // inside a pane first refusal — the network list and the wheel rows
        // already consume the arrows they care about while bubbling to here.
        cycleTab(e.key === "ArrowRight" ? 1 : -1);
        e.preventDefault();
      }
      return;
    }
    // Nothing else is ours. Every other key either belongs to the headset (the
    // keyboard is grabbed, so we never see it) or to nobody.
  });

  function isTextField(el) {
    return !!el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA");
  }

  poll();
  setInterval(poll, 1000);
  uiPoll();
})();
</script>
</body>
</html>
