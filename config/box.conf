# Adiona-TV display box — site configuration
# Sourced as shell (KEY=VALUE, no spaces around =) by the first-boot script and
# the controller. Edit BEFORE building the image to change fleet-wide defaults.

# ── Wi-Fi access point (the LAN the Quest joins) ─────────────────────────────
# The SSID is generated per-device at first boot as:  <SSID_PREFIX>-XXXX
# where XXXX is a stable 4-hex-digit hash of the Pi's wlan0 MAC. So every box is
# uniquely named without per-card configuration. Only the prefix is set here.
SSID_PREFIX="Adiona-TV"

# Shared WPA2 passphrase (8–63 chars). Same on every box so a customer types it
# once per headset. CHANGE THIS before building your fleet image.
WIFI_PASSPHRASE="stoPdrunKdrivinG"

# Band the AP runs on: "bg" = 2.4 GHz, "a" = 5 GHz.
#
# 2.4 GHz is the default for range, but it is the most contended spectrum at a
# public venue and it rate-adapts down hard at distance — and a link that can't
# carry the stream is what starts every latency problem. 5 GHz has far more clean
# spectrum and both Quest 2 and Quest 3 handle it well; at typical event range
# (headset a few metres from the box) it is the better choice. Worth testing per
# venue.
WIFI_BAND="bg"

# Channel. Must belong to WIFI_BAND: 2.4 GHz → 1, 6 or 11; 5 GHz → 36 or 149.
WIFI_CHANNEL="6"

# WiFi regulatory country (ISO 3166-1 alpha-2). REQUIRED: Raspberry Pi keeps the
# Wi-Fi radio rfkill-blocked until a country is set, so the AP can't broadcast
# without this. Set to your deployment region.
WIFI_COUNTRY="US"

# ── LAN addressing (NetworkManager 'shared' mode) ───────────────────────────
# The Pi is the gateway at <AP_GATEWAY> and hands out DHCP on this /24.
# NAT to the Ethernet uplink (eth0) is automatic whenever eth0 has a route.
AP_GATEWAY="192.168.50.1"
AP_CIDR="192.168.50.1/24"

# Path NetworkManager's shared-mode dnsmasq writes leases to (interface-named).
DHCP_LEASE_FILE="/var/lib/NetworkManager/dnsmasq-wlan0.leases"

# ── Casting / stream discovery ──────────────────────────────────────────────
# UDP port the headset sends its RTP/H.264 video to, and this box plays from.
# This is the PRIMARY stream path. Must match RTP_PORT in the Adiona-G casting
# plugin (CastingPlugin.kt) — change both together or the stream goes nowhere.
RTP_PORT="5004"

# Receiver jitter buffer, milliseconds. How long the player waits for a delayed
# or out-of-order packet before giving up on it. Packets later than this are
# DROPPED, never waited for, which is what keeps the picture at the live edge
# instead of accumulating delay.
#
# The floor is set by the FRAME PERIOD, not by network jitter. The stream is
# 15 fps, so frames are 66 ms apart and each arrives as one burst of packets. A
# buffer shorter than that (50 ms was tried) discards packets it should have
# waited for, and partial frames decode as heavy blocking/smearing that looks
# like a codec mismatch. Keep this at roughly 2 frame periods.
#
# If the encoder's frame rate changes (CastingPlugin.FPS), revisit this.
PLAYER_LATENCY_MS="120"

# How the video player shares the display with the Chromium splash page:
#   stack — Chromium stays running behind the video (default; instant switching)
#   swap  — Chromium is stopped while the video plays
# Use "swap" only if this box's cage build refuses to map the player on top of
# Chromium (symptom: headset is casting but the splash stays visible).
PLAYER_OVERLAY_MODE="stack"

# Port each Adiona-G headset serves its viewer + WebSocket stream on. Fixed by
# the app (Android can't bind <1024 without root) — do not change. The box uses
# it only to detect *which* headsets are casting; the video itself arrives over
# RTP_PORT above.
CAST_PORT="8080"

# How often (seconds) the controller re-scans connected headsets for an active
# cast server, and how long it holds "Reconnecting…" before falling back to the
# "waiting" screen after a live stream drops with no replacement.
SCAN_INTERVAL_SECONDS="2"
RECONNECT_GRACE_SECONDS="20"

# ── Local controller (what Chromium opens in kiosk) ─────────────────────────
# Loopback-only HTTP port for the controller's kiosk page + /state endpoint.
# Distinct from CAST_PORT to avoid confusion; never exposed off the box.
CONTROLLER_PORT="8090"
