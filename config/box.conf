# Adiona-TV display box — site configuration
# Sourced as shell (KEY=VALUE, no spaces around =) by the first-boot script and
# the controller. Edit BEFORE building the image to change fleet-wide defaults.

# ── Wi-Fi access point (the LAN the Quest joins) ─────────────────────────────
# The SSID is generated per-device at first boot as:  <SSID_PREFIX>-XXXX
# where XXXX is a stable 4-hex-digit hash of the Pi's wlan0 MAC. So every box is
# uniquely named without per-card configuration. Only the prefix is set here.
SSID_PREFIX="Adiona-TV"

# Shared WPA2 passphrase (8–63 chars). Same on every box so a customer types it
# once per headset. CHANGE THIS before building your fleet image.
WIFI_PASSPHRASE="stoPdrunKdrivinG"

# ── Band plan ────────────────────────────────────────────────────────────────
# The box has TWO radios and they must not share a band. Both are dual-band and
# both can host an AP (verified on hardware: the Pi 5's internal brcmfmac offers
# 29 channels of 5 GHz, the RTL8821CU dongle 25), so the split is a choice:
#
#     AP (headset LAN)   -> wlan0, internal radio, 5 GHz   <- WIFI_BAND below
#     Uplink (internet)  -> wlan1, USB dongle,     2.4 GHz <- UPLINK_BAND below
#
# Why this way round rather than the reverse: the AP carries the video stream, so
# it belongs on the better-proven radio (brcmfmac AP mode is the standard Pi
# configuration; rtw88's USB AP support is far less exercised) AND benefits from
# the cleaner band. The dongle does client mode, which is what USB adapters are
# good at.
#
# Why they must differ at all: with both on 2.4 GHz the two antennas sit
# centimetres apart and the AP's transmissions deafen the dongle's receiver. That
# showed up in the logs as auth frames needing 2-3 retries even when they
# succeeded, re-association every ~10 s, and eventually 'ssid-not-found' with the
# upstream AP still plainly in range. A USB extension cable helped, which is the
# signature of exactly this problem.

# Band the AP runs on: "bg" = 2.4 GHz, "a" = 5 GHz.
#
# FALLBACK: if a venue needs more range than 5 GHz gives (a headset far from the
# box), set this back to "bg" with WIFI_CHANNEL 1, 6 or 11, set UPLINK_BAND to
# "a", and apply with `.\tools\deploy.ps1 -FirstBoot`. No reflash needed. Keep
# the two bands different whichever way round you run them.
WIFI_BAND="a"

# Channel. Must belong to WIFI_BAND: 2.4 GHz → 1, 6 or 11; 5 GHz → 36 or 149.
# Prefer 36-48 or 149-165: those are non-DFS, so the AP starts instantly. The
# 52-144 range requires radar detection and delays or drops the beacon.
WIFI_CHANNEL="36"

# Band the UPSTREAM (internet) Wi-Fi dongle is restricted to: "bg", "a", or empty
# for no restriction. Pinning it is what guarantees it cannot wander onto the
# AP's band and recreate the interference. Set it empty only if a venue's network
# is available solely on the same band as the AP - in which case prefer Ethernet.
UPLINK_BAND="bg"

# WiFi regulatory country (ISO 3166-1 alpha-2). REQUIRED: Raspberry Pi keeps the
# Wi-Fi radio rfkill-blocked until a country is set, so the AP can't broadcast
# without this. Set to your deployment region.
WIFI_COUNTRY="US"

# ── LAN addressing (NetworkManager 'shared' mode) ───────────────────────────
# The Pi is the gateway at <AP_GATEWAY> and hands out DHCP on this /24.
# NAT to the Ethernet uplink (eth0) is automatic whenever eth0 has a route.
AP_GATEWAY="192.168.50.1"
AP_CIDR="192.168.50.1/24"

# Path NetworkManager's shared-mode dnsmasq writes leases to (interface-named).
DHCP_LEASE_FILE="/var/lib/NetworkManager/dnsmasq-wlan0.leases"

# ── Casting / stream discovery ──────────────────────────────────────────────
# UDP port the headset sends its RTP/H.264 video to, and this box plays from.
# This is the PRIMARY stream path. Must match RTP_PORT in the Adiona-G casting
# plugin (CastingPlugin.kt) — change both together or the stream goes nowhere.
RTP_PORT="5004"

# Receiver jitter buffer, milliseconds. How long the player waits for a delayed
# or out-of-order packet before giving up on it. Packets later than this are
# DROPPED, never waited for, which is what keeps the picture at the live edge
# instead of accumulating delay.
#
# The floor is set by the FRAME PERIOD, not by network jitter. The stream is
# 15 fps, so frames are 66 ms apart and each arrives as one burst of packets. A
# buffer shorter than that (50 ms was tried) discards packets it should have
# waited for, and partial frames decode as heavy blocking/smearing that looks
# like a codec mismatch. Keep this at roughly 2 frame periods.
#
# If the encoder's frame rate changes (CastingPlugin.FPS), revisit this.
PLAYER_LATENCY_MS="120"

# How long (seconds) the last frame stays frozen on screen after the stream stops
# before the box returns to the waiting splash. It reconnects on its own as soon
# as frames resume. Measured from actual packet arrival, not from app state: a
# headset taken off the head or an app in the background keeps serving :8080
# while sending nothing at all. Lower for a snappier return to the splash, raise
# to ride out longer pauses without losing the picture.
STREAM_TIMEOUT_SEC="30"

# Inbound UDP datagrams/second above which the stream counts as flowing. The real
# stream is ~150-300 pkt/s and idle background chatter is a handful, so anything
# in between works. Only worth touching if the box ever carries other UDP traffic.
RTP_FLOW_MIN_PPS="20"

# How the video player shares the display with the Chromium splash page:
#   stack — Chromium stays running behind the video (default; instant switching)
#   swap  — Chromium is stopped while the video plays
# Use "swap" only if this box's cage build refuses to map the player on top of
# Chromium (symptom: headset is casting but the splash stays visible).
PLAYER_OVERLAY_MODE="stack"

# Port each Adiona-G headset serves its viewer + WebSocket stream on. Fixed by
# the app (Android can't bind <1024 without root) — do not change. The box uses
# it only to detect *which* headsets are casting; the video itself arrives over
# RTP_PORT above.
CAST_PORT="8080"

# How often (seconds) the controller re-scans connected headsets for an active
# cast server, and how long it holds "Reconnecting…" before falling back to the
# "waiting" screen after a live stream drops with no replacement.
SCAN_INTERVAL_SECONDS="2"
RECONNECT_GRACE_SECONDS="20"

# ── Local controller (what Chromium opens in kiosk) ─────────────────────────
# Loopback-only HTTP port for the controller's kiosk page + /state endpoint.
# Distinct from CAST_PORT to avoid confusion; never exposed off the box.
CONTROLLER_PORT="8090"

# ── LAN wheel (USB racing wheel plugged into this box) ───────────────────────
# UDP port adiona-wheel.py listens on for the headset's subscribe keepalive and
# streams controller readings back to. Must match LanWheelManager.gd's port in
# Adiona-G — change both together. Deliberately NOT 5005, which is the
# conventional RTCP pair for the RTP_PORT above.
WHEEL_PORT="5010"

# Controller state packets per second. The headset's physics runs at 60 Hz, so
# anything above ~120 buys nothing measurable; below ~60 starts showing up as
# steering lag. Every packet is a complete snapshot, so a dropped one costs
# 1/WHEEL_TX_HZ of staleness and nothing else — there is no retransmission and
# no benefit to adding one.
WHEEL_TX_HZ="120"

# Steering rotation range in degrees written to the wheel's HID sysfs attribute,
# used when a device has no saved mapping. 900 is the full travel of a G920/G29
# (~2.5 turns lock to lock, realistic); 270 matches a low-end wheel. The headset
# derives its own full-lock angle as half of whatever this ends up being, so
# changing it here changes the feel without touching the game. Per-device values
# saved from the on-TV setup UI (/etc/adiona/wheel-map.json) override this.
WHEEL_DEFAULT_RANGE_DEG="900"

# Spring-to-centre strength, 0-100%, for wheels that support force feedback.
# The G920 has NO centring of its own: without this it stays wherever you leave
# it, so the car holds a turn after the driver lets go. Sent as the standard
# Linux FF_AUTOCENTER effect, which hid-logitech-hidpp translates into the
# wheel's native command — do not hand-roll HID++ packets for this.
# 0 disables centring. Per-device values saved from the on-TV setup UI override.
WHEEL_AUTOCENTER_PCT="50"
